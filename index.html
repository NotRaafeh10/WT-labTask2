</head>
<body>
    <h1>Blood Donor Registration</h1>

    <form action="post" id="regForm" onsubmit="return validateForm()">
        <label for="fname">Full Name</label>
        <input type="text" id="fname" name="fname" required minlength="3">
        <span id="err-fname" class="error"></span>
<br>
        <label for="sid">AIUB ID</label>
        <input type="text" id="sid" name="sid" pattern="[0-9]{2}+-[0-9]{5}+-[0-9]{1}">
        <span id="err-sid" class="error"></span>
<br>
        <label for="phone">Mobile</label>
        <input type="text" id="phone" name="phone" required pattern="{11}">
        <span id="err-phone" class="error"></span>
<br>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" required min="18" max="60">
        <span id="err-age" class="error"></span>
<br>
        <label for="bgroup">Blood Group</label>
        <select name="bgroup" id="bgroup">
<option value="">Select blood group</option>
<option value="A+">A+</option>
<option value="A-">A-</option>
<option value="B+">B+</option>
<option value="B-">B-</option>
<option value="O+">O+</option>
<option value="O-">O-</option>
<option value="AB+">AB+</option>
<option value="AB-">AB-</option>
        </select>

        <span id="err-bgroup" class="error"></span>
<br>
        <label for="donate">Donated before: </label>
        <input type="radio" name="donated" id="donated" value="donated-yes" required>Yes
        <input type="radio" name="donated" id="donated" value="donated-no" required>No

        <span id="err-donated" class="error"></span>
<br>
        <input type="checkbox" id="agree" name="agree" required> I am healthy and willing to donate
<br>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" required minlength="6">
        <span id="err-pass" class="error"></span>
        <br>
        <label for="pass2">Confirm Password</label>
        <input type="password" id="pass2" name="pass2" required minlength="6">
        <span id="err-pass2" class="error"></span>
        <br>
        <input type="submit" id="submit" name="submit">
    </form>
    <p id="count">Total donors: </p>

    <table id="list">
<tr>
    <th>Name</th>
    <th>ID</th>
    <th>Blood Group</th>
    <th>Action</th>
</tr>

    </table>

</body>
</html>
